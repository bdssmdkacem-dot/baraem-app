name: baraem
description: "براعم - تطبيق تعليم القيم الإسلامية للأطفال (أذكار، قصص الأنبياء، آداب)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  lottie: ^3.1.2
  confetti: ^0.7.0
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/adkar/
    - assets/audio/stories/
