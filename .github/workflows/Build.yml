name: Build Baraem APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: baraem-apk-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Baraem logo
        run: |
          test -f assets/images/baraem_logo.png
          file assets/images/baraem_logo.png

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.baraem --project-name=baraem .

      - name: Pin Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Baraem launcher icon
        run: |
          set -e
          src="assets/images/baraem_logo.png"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            magick "$src" -resize "${size}x${size}" -strip "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: baraem-release
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
