name: Baraem APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baraem-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify real Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/baraem/baraem/MainActivity.kt
          test -f assets/images/baraem_logo.png || test -f assets/images/logo-baraeam.png
          test -d assets/audio/adkar
          test -d assets/audio/stories

      - name: Configure CI local.properties
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLUTTER_ROOT:-}"
          test -n "${ANDROID_SDK_ROOT:-}"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> android/local.properties
          echo 'Gradle local.properties configured for CI'

      - name: Generate Gradle wrapper only
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraem-release
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
