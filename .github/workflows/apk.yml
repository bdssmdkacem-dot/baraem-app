name: Baraem APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baraem-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Verify project assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/images/baraem_logo.png || test -f assets/images/logo-baraeam.png
          test -d assets/audio/adkar
          test -d assets/audio/stories

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.baraem --project-name=baraem .

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          if 'ndkVersion =' in text:
              import re
              text = re.sub(r'ndkVersion\s*=\s*[^\n]+', 'ndkVersion = "27.0.12077973"', text)
          else:
              marker = 'android {\n'
              if marker not in text:
                  raise SystemExit('android { block not found')
              text = text.replace(marker, marker + '    ndkVersion = "27.0.12077973"\n', 1)
          p.write_text(text)
          PY

          echo '--- android/app/build.gradle.kts ---'
          grep -n 'ndkVersion' android/app/build.gradle.kts

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraem-release
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
